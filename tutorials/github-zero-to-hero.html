L("conflicts", "Intermediate", "Resolving merge conflicts", "7 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Sooner or later, you'll see this message:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">bash</div>
      </div>
      <div class="terminal-body">
<span class="term-out">Auto-merging contact.html</span>
<span class="term-out err">CONFLICT (content): Merge conflict in contact.html</span>
<span class="term-out warn">Automatic merge failed; fix conflicts and then commit the result.</span>
      </div>
    </div>

    <p>Don't panic. A merge conflict means Git found a spot where two branches both changed the same lines, and it can't tell which version you want. It's asking you to pick.</p>

    <h2>What the conflict markers look like</h2>
    <p>When you open the conflicted file, you'll see something like this:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">contact.html</div>
      </div>
      <div class="terminal-body">
<span class="term-out">&lt;h1&gt;Get in touch&lt;/h1&gt;</span>
<span class="term-out err">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</span>
<span class="term-out added">&lt;p&gt;We respond within 24 hours.&lt;/p&gt;</span>
<span class="term-out muted">=======</span>
<span class="term-out hunk">&lt;p&gt;Email us anytime at hello@example.com.&lt;/p&gt;</span>
<span class="term-out err">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/contact-form</span>
<span class="term-out">&lt;form&gt;...&lt;/form&gt;</span>
      </div>
    </div>

    <p>Read it like this:</p>
    <ul>
      <li>Everything between <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</code> and <code>=======</code> is the version on your current branch.</li>
      <li>Everything between <code>=======</code> and <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/contact-form</code> is the version from the branch you're merging in.</li>
    </ul>

    <h2>How to resolve it</h2>
    <p>Edit the file directly. Delete the markers. Keep whichever version is correct — or combine the two. End up with what the file <em>should</em> look like after the merge:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">contact.html (after editing)</div>
      </div>
      <div class="terminal-body">
<span class="term-out">&lt;h1&gt;Get in touch&lt;/h1&gt;</span>
<span class="term-out added">&lt;p&gt;Email us anytime at hello@example.com. We respond within 24 hours.&lt;/p&gt;</span>
<span class="term-out">&lt;form&gt;...&lt;/form&gt;</span>
      </div>
    </div>

    <p>Then stage and commit:</p>

    ${term("conflict-resolve")}

    <p>That's it. The merge is complete. Git is happy.</p>

    <div class="callout tip">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8V18h6v-1.5c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2z"/></svg>
        Conflicts are not failures
      </div>
      <div class="callout-body">
        <p>A merge conflict isn't Git breaking. It's Git being honest: "Two people changed the same line, and I can't read minds." The right person to resolve it is whoever understands what the file <em>should</em> say — often that's a brief chat with whoever wrote the other change.</p>
      </div>
    </div>

    <h2>If you panic, abort</h2>
    <p>If you started a merge and want to back out completely, no harm done:</p>

    ${term("conflict-abort")}

    <p>This undoes the merge and returns the repo to exactly the state it was in before you ran <code>git merge</code>.</p>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li>A conflict happens when two branches edited the same lines. Git asks you to pick.</li>
        <li>Edit the file to remove the <code>&lt;&lt;&lt;</code>/<code>===</code>/<code>&gt;&gt;&gt;</code> markers and leave the correct final content.</li>
        <li><code>git add</code> + <code>git commit</code> completes the merge.</li>
        <li><code>git merge --abort</code> bails out cleanly if you change your mind.</li>
      </ul>
    </div>
  `);
});

L("pull-requests", "Intermediate", "Pull Requests on GitHub", "7 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>A <strong>Pull Request</strong> (PR) is the GitHub way of merging a branch — but with discussion, code review, and (optionally) automated checks in between. It's where collaboration actually happens.</p>

    <h2>The flow</h2>
    <ol>
      <li>Push your branch to GitHub (last lesson).</li>
      <li>Open a PR: "I'd like to merge <code>feature/contact-form</code> into <code>main</code>."</li>
      <li>Teammates review the changes, leave comments, request edits.</li>
      <li>You push more commits to the branch — they automatically show up in the PR.</li>
      <li>Once everyone approves (and any automated tests pass), click <strong>Merge</strong>.</li>
    </ol>

    <h2>Opening a PR</h2>
    <p>On the repo page, GitHub shows a yellow banner after you push a branch. Click <em>Compare & pull request</em>. You land on a form:</p>

    <div class="gh-mock">
      <div class="gh-mock-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
        Open a pull request &nbsp; <span style="color: var(--text-3); font-size: 11.5px;">base: main ← compare: feature/contact-form</span>
      </div>
      <div class="gh-mock-body">
        <p style="margin-top:0;"><strong>Title:</strong> Add contact form to homepage</p>
        <p style="line-height:1.7;"><strong>Description</strong></p>
        <div style="background: var(--bg); border: 1px solid var(--border); padding: 10px 12px; border-radius: 6px; font-family: var(--mono); font-size: 12.5px; color: var(--text-2); line-height: 1.6;">## What this changes<br/>Adds a contact form to the homepage with name, email, and message fields.<br/><br/>## How to test<br/>1. Open the homepage<br/>2. Scroll to the bottom<br/>3. Submit the form — should show a "thanks" message<br/><br/>Closes #14</div>
        <p style="margin: 12px 0 4px;"><strong>Reviewers:</strong> @amelia &nbsp; <strong>Labels:</strong> <span class="badge feat">feature</span></p>
      </div>
    </div>

    <p>A good PR description has three things: <em>what</em> it changes, <em>how to test it</em>, and any <em>context</em> (a related issue, screenshots, design link). "<code>Closes #14</code>" tells GitHub: when this PR merges, automatically close issue #14.</p>

    <h2>The PR page itself</h2>
    <p>After you open the PR, you land on its discussion page. The four tabs at the top are the important ones:</p>
    <ul>
      <li><strong>Conversation</strong> — comments, status checks, merge button.</li>
      <li><strong>Commits</strong> — every commit on the branch.</li>
      <li><strong>Checks</strong> — automated tests (we'll cover these in the GitHub Actions lesson).</li>
      <li><strong>Files changed</strong> — the diff. This is where reviewers spend most of their time.</li>
    </ul>

    <h2>The merge button</h2>
    <p>At the bottom of the Conversation tab, three merge options:</p>
    <ul>
      <li><strong>Create a merge commit</strong> — default. Adds a "merge commit" tying the branch back into main, preserving the history.</li>
      <li><strong>Squash and merge</strong> — collapses every commit on the branch into one tidy commit on main. Most teams prefer this for feature branches: it keeps main's history readable.</li>
      <li><strong>Rebase and merge</strong> — replays the branch's commits on top of main as if they were always there. Cleanest line, but rewrites history. Use when the team has agreed.</li>
    </ul>

    <div class="callout tip">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8V18h6v-1.5c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2z"/></svg>
        For a non-developer
      </div>
      <div class="callout-body">
        <p>You don't need to merge PRs yourself — but you should be able to <em>read</em> them. Open the <em>Files changed</em> tab and you'll see red lines (removed) and green lines (added). Even without writing code, that diff tells you what your developer is changing and you can ask questions inline.</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li>A Pull Request is GitHub's merge-with-discussion-and-review wrapper around a branch.</li>
        <li>Good PR descriptions answer: what, how to test, why (or link to the related issue).</li>
        <li><strong>Squash and merge</strong> is the most common pattern — it keeps main's history clean.</li>
        <li>Reading PRs is a non-developer superpower: you see exactly what's changing before it goes live.</li>
      </ul>
    </div>

L("code-review", "Intermediate", "Reviewing code and approving PRs", "6 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Code review is where a teammate looks at your PR before it merges. It catches bugs, spreads knowledge, and keeps quality high. Even when you're the non-developer hiring someone, you can (and should) participate.</p>

    <h2>The Files changed tab</h2>
    <p>This is the reviewer's main view. Every change in the PR is shown as a <strong>diff</strong>: removed lines in red, added lines in green, context lines uncoloured. A small file might look like:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">homepage.html — diff</div>

<span class="term-out hunk">@@ -42,6 +42,11 @@ </span><span class="term-out muted">&lt;footer&gt;</span>
<span class="term-out">    &lt;p&gt;&copy; 2026 My Company&lt;/p&gt;</span>
<span class="term-out">  &lt;/footer&gt;</span>
<span class="term-out added">+ &lt;section id="contact"&gt;</span>
<span class="term-out added">+   &lt;h2&gt;Get in touch&lt;/h2&gt;</span>
<span class="term-out added">+   &lt;form action="/submit"&gt;</span>
<span class="term-out added">+     &lt;!-- name, email, message inputs --&gt;</span>
<span class="term-out added">+   &lt;/form&gt;</span>
<span class="term-out added">+ &lt;/section&gt;</span>
<span class="term-out">&lt;/body&gt;</span>
      </div>
    </div>

    <p>The <code>@@ -42,6 +42,11 @@</code> bit is the <em>hunk header</em>: "this change starts around line 42; the old version had 6 lines, the new one has 11."</p>

    <h2>Leaving feedback</h2>
    <p>Hover over any line and click the blue <strong>+</strong> icon — a comment box opens right there. Your comment will be anchored to that exact line. You can:</p>
    <ul>
      <li><strong>Add single comment</strong> — posts immediately as a one-off note.</li>
      <li><strong>Start a review</strong> — queue up multiple comments and send them as a batch at the end (better — avoids spamming the author with notifications).</li>
      <li><strong>Suggest a change</strong> — propose specific replacement text the author can apply with one click.</li>
    </ul>

    <h2>Finishing the review</h2>
    <p>At the top right of Files changed, click <strong>Review changes</strong>. Three options:</p>
    <ul>
      <li><strong>Comment</strong> — leave thoughts without explicitly approving or rejecting.</li>
      <li><strong>Approve</strong> — green check. "Looks good, ship it."</li>
      <li><strong>Request changes</strong> — red X. "Needs work before merging." The author has to push fixes before you can approve.</li>
    </ul>

    <h2>Etiquette</h2>
    <ul>
      <li><strong>Be specific.</strong> "This will break on Safari because it doesn't support that feature" beats "this looks wrong."</li>
      <li><strong>Suggest, don't dictate.</strong> Phrase comments as questions or proposals ("Could we use X here instead?") unless something is plainly broken.</li>
      <li><strong>Approve when you mean it.</strong> Rubber-stamping is worse than no review at all.</li>
      <li><strong>Praise good work.</strong> "Nice clean refactor" matters. People underestimate this.</li>
    </ul>

    <div class="callout info">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        What a non-developer can usefully review
      </div>
      <div class="callout-body">
        <p>You can't always evaluate code correctness, but you can check: Does the PR match what we discussed? Are the file names sensible? Is the description clear? Did the automated checks pass? Is there a screenshot if it's a UI change? Those alone catch a lot of mis-communications.</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>

        <li>Comments anchor to specific lines. <strong>Start a review</strong> bundles comments before sending.</li>

  `);

<script>
L("rebase", "Advanced", "Rebase vs merge", "6 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Both <code>merge</code> and <code>rebase</code> combine two branches. They produce the same files at the end — but the <em>history</em> looks different. Knowing when to use which is a small but real skill.</p>

    <h2>What rebase does</h2>
    <p>Imagine main has moved on while you were working on your branch. With <code>merge</code>, Git ties the two histories together with a merge commit. With <code>rebase</code>, Git pretends your branch was started <em>right now</em> instead of when you actually branched off — it replays your commits on top of the latest main.</p>

    <div class="branch-diagram"><span class="bd-label">BEFORE rebase</span>

<span class="bd-main">main</span>      A───B───C───D
                  \\
<span class="bd-feat">feature</span>          X───Y───Z

<span class="bd-label">AFTER  git rebase main</span>  (run while on feature)

<span class="bd-main">main</span>      A───B───C───D
                              \\
<span class="bd-feat">feature</span>                      X'───Y'───Z'</div>

    <p>Notice the apostrophes: <code>X'</code>, <code>Y'</code>, <code>Z'</code>. These are <em>new</em> commits — same changes, but built on top of main's new tip. Rebase rewrites history.</p>

    <h2>The command</h2>

    ${term("rebase-demo")}

    <p>If there's a conflict during the rebase, you fix it the same way as a merge conflict, then run <code>git rebase --continue</code>.</p>

    <h2>When to use which</h2>
    <ul>
      <li><strong>Merge</strong> when you want to preserve the truth of what happened, including the fact that two lines of work existed in parallel. Default choice for combining feature branches via Pull Requests.</li>
      <li><strong>Rebase</strong> when you want a clean, linear history — and the branch is yours alone. Common before opening a PR, to put your branch on top of latest main so the diff is small.</li>
    </ul>

    <div class="callout danger">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Never rebase a shared branch
      </div>
      <div class="callout-body">
        <p>If anyone else has pulled your branch, rebasing will rewrite the commits and confuse Git on their end. Rule of thumb: only rebase branches that <strong>you</strong> have pushed, and that <strong>nobody else</strong> has pulled.</p>
      </div>
    </div>

    <h2>Interactive rebase: editing your history</h2>
    <p>The most powerful (and slightly dangerous) version is <code>git rebase -i</code> — "interactive" rebase. It lets you reorder, squash, or rename commits before pushing them. Useful for cleaning up a messy branch:</p>

    ${term("rebase-interactive")}

    <p>This opens an editor where each commit is on a line prefixed with <code>pick</code>. Change <code>pick</code> to <code>squash</code> to fold a commit into the one above it, <code>reword</code> to change its message, or rearrange the lines to reorder. Save, exit, done.</p>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li><strong>Merge</strong> ties branches together with a merge commit, preserving the truth.</li>
        <li><strong>Rebase</strong> replays your commits on top of another branch — cleaner history, but rewrites commits.</li>
        <li>Never rebase shared branches. Only rebase your own work that nobody else has pulled.</li>
        <li><code>git rebase -i</code> lets you squash, reword, or reorder commits before sharing them.</li>
      </ul>
    </div>
  `);
});

L("issues", "Advanced", "Issues, labels, milestones", "6 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Every repo has an <strong>Issues</strong> tab. Think of issues as a built-in bug tracker / to-do list / discussion board. They're how teams track everything that needs doing.</p>

    <h2>What an issue looks like</h2>
    <div class="gh-mock">
      <div class="gh-mock-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Issues — my-landing-site &nbsp; <span style="color: var(--text-3); font-size: 11.5px; margin-left: auto;">5 Open &nbsp; 24 Closed</span>
      </div>
      <div class="gh-mock-body" style="padding: 0;">
        <div class="pr-row">
          <div class="pr-icon open">!</div>
          <div class="pr-content">

        <div class="pr-row">
          <div class="pr-icon open">!</div>
          <div class="pr-content">
            <div class="pr-title">Add dark mode toggle <span class="badge feat">feature</span> <span class="badge help">help wanted</span></div>
            <div class="pr-meta">#36 opened 5 days ago by USERNAME</div>
          </div>
        </div>
        <div class="pr-row">
          <div class="pr-icon open">!</div>
          <div class="pr-content">
            <div class="pr-title">Update FAQ copy for Q3 launch <span class="badge docs">docs</span></div>
            <div class="pr-meta">#35 opened 1 week ago by USERNAME — milestone: Q3 launch</div>
          </div>
        </div>
        <div class="pr-row">
          <div class="pr-icon open">!</div>
          <div class="pr-content">
            <div class="pr-title">Set up Google Analytics <span class="badge good-first">good first issue</span></div>
            <div class="pr-meta">#34 opened 1 week ago by USERNAME</div>
          </div>
        </div>
      </div>
    </div>

    <h2>Anatomy of a good issue</h2>
    <p>Three sections, every time:</p>
    <ul>
      <li><strong>What's wrong / what's needed</strong> — describe the symptom or the feature. Be specific.</li>
      <li><strong>Steps to reproduce</strong> (for bugs) — exactly how to make the bug happen. Without this, the developer has to guess.</li>
      <li><strong>Expected vs actual</strong> — what should happen vs what does happen.</li>
    </ul>

    <h2>Labels</h2>
    <p>Labels are coloured tags that categorize issues. GitHub repos usually have:</p>
    <ul>
      <li><span class="badge bug">bug</span> — something broken</li>
      <li><span class="badge feat">feature</span> / <span class="badge feat">enhancement</span> — new functionality</li>
      <li><span class="badge docs">documentation</span> — needs writing or fixing in docs</li>
      <li><span class="badge good-first">good first issue</span> — easy enough for a new contributor</li>
      <li><span class="badge help">help wanted</span> — the maintainer welcomes outside help</li>
    </ul>

    <p>You can add as many labels as you want, and filter the issue list by them. <code>label:bug is:open</code> in the search bar shows every open bug.</p>

    <h2>Milestones</h2>
    <p>A <strong>milestone</strong> is a deadline-based group of issues. "Q3 launch" might be a milestone with 12 issues attached; as each issue closes, the milestone shows progress (e.g. 7 of 12 done). Great for tracking releases or sprints.</p>

    <h2>Linking issues to PRs</h2>
    <p>If a PR description contains a phrase like <code>Closes #37</code>, <code>Fixes #14</code>, or <code>Resolves #22</code>, then when the PR merges, GitHub automatically closes that issue. This is the magic glue: open an issue, do the work in a PR that references the issue, merge the PR, issue closes itself.</p>

        <li>Good issues are specific: what's wrong, how to reproduce, what was expected.</li>
        <li>Labels categorize. Milestones group toward a deadline.</li>
        <li><code>Closes #N</code> in a PR auto-closes issue N when the PR merges.</li>
      </ul>
    </div>
  `);
});

L("collaboration", "Advanced", "Collaboration: @mentions, teams, CODEOWNERS", "5 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Once more than one person is involved, GitHub has a small set of tools that make collaboration feel natural rather than chaotic.</p>

    <h2>@mentions</h2>
    <p>Anywhere you can write text — issues, PR descriptions, review comments — typing <code>@username</code> notifies that person. They get an email and an inbox notification on GitHub.</p>

    <p>Common uses:</p>
    <ul>
      <li><code>@amelia could you double-check the styling on mobile?</code></li>
      <li><code>cc @dev-jordan — your PR from yesterday touches this same file</code></li>
    </ul>

    <h2>Assignees and reviewers</h2>
    <p>On any issue or PR, you can set:</p>
    <ul>
      <li><strong>Assignees</strong> — who's responsible for getting it done (typically 1 person).</li>
      <li><strong>Reviewers</strong> (PRs only) — who needs to look at it before it can merge.</li>
    </ul>

    <h2>Teams (organization repos)</h2>
    <p>If your GitHub account is a single user, you can give access to specific people repo-by-repo (Settings → Collaborators). If you're on an <strong>organization</strong> account (free for small teams), you can group people into <em>teams</em>: <code>@my-org/designers</code>, <code>@my-org/engineering</code>. You can grant a whole team access to a repo at once, and you can <code>@</code>-mention a team to notify everyone in it.</p>

    <h2>CODEOWNERS</h2>
    <p>This is a power feature, worth knowing about. Put a file at <code>.github/CODEOWNERS</code> mapping file paths to people:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">.github/CODEOWNERS</div>
      </div>
      <div class="terminal-body">
<span class="term-out muted"># Anything in /design needs Amelia's approval</span>
<span class="term-out">/design/         @amelia</span>
<span class="term-out muted"></span>
<span class="term-out muted"># Anything in /src needs an engineer</span>
<span class="term-out">/src/            @my-org/engineering</span>
<span class="term-out muted"></span>
<span class="term-out muted"># The marketing folder is the marketing team's</span>
<span class="term-out">/marketing/      @my-org/marketing</span>
      </div>
    </div>

    <p>Now whenever a PR touches a file matching one of those paths, GitHub <em>automatically</em> requests review from the right person or team. No more "who should approve this?" — it's already done.</p>

    <div class="callout info">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Notifications without overwhelm
      </div>
      <div class="callout-body">
        <p>GitHub's notifications can flood your inbox. Two things help: in <em>Settings → Notifications</em>, route most events to the in-app inbox instead of email; and "watch" only the repos you actually care about. You can mute the rest.</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li><code>@username</code> in any text field pings that person.</li>
        <li>Assignees own the work; reviewers approve it.</li>
        <li>Teams (in organizations) let you group people and grant access in bulk.</li>
        <li>CODEOWNERS auto-routes review requests based on which files a PR touches.</li>
      </ul>
    </div>
  `);
});

L("actions-intro", "Advanced", "Intro to GitHub Actions", "6 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p><strong>GitHub Actions</strong> is GitHub's automation engine. It runs little scripts (called <em>workflows</em>) in response to events in your repo — when someone pushes a commit, opens a PR, creates a tag, schedules a time, etc. Think of it as IFTTT/Zapier built right into your codebase.</p>

    <h2>What you can do with Actions</h2>
    <ul>
      <li>Run automated tests on every push, so broken code never makes it to main.</li>
      <li>Deploy to a server (Netlify, Vercel, AWS, your own machine) when main updates.</li>
      <li>Auto-label issues, close stale PRs, post Slack messages.</li>
      <li>Build and publish releases.</li>
      <li>Generate weekly reports.</li>
    </ul>

    <h2>How a workflow is defined</h2>
    <p>A workflow is a YAML file in <code>.github/workflows/</code>. YAML is a simple key-value format — easy to read once you've seen one. Here's the simplest possible example:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">.github/workflows/hello.yml</div>
      </div>
      <div class="terminal-body">
<span class="term-out hunk">name:</span><span class="term-out"> Say hello</span>
<span class="term-out hunk">on:</span><span class="term-out"> push</span>

<span class="term-out hunk">jobs:</span>
<span class="term-out">  greet:</span>
<span class="term-out">    runs-on: ubuntu-latest</span>
<span class="term-out">    steps:</span>
<span class="term-out">      - name: Print a message</span>
<span class="term-out">        run: echo "Hello from GitHub Actions!"</span>
      </div>
    </div>

    <p>Reading that:</p>
    <ul>
      <li><code>name</code> — what the workflow is called (shows up on the Actions tab).</li>

    <p>Commit this file, push, and on the Actions tab you'll see your workflow run on every push from then on.</p>

    <h2>The Actions tab</h2>
    <div class="gh-mock">

    <p>Click a run to see the logs — every step's output is captured, so when something fails you can see exactly why.</p>

    <h2>The marketplace</h2>
    <p>You don't have to write steps from scratch. The <a href="https://github.com/marketplace?type=actions">GitHub Actions Marketplace</a> has thousands of pre-built actions — "check out my code", "set up Node.js", "deploy to Vercel", "publish a release", "send a Slack message". You pull them in with <code>uses: someone/action-name@v3</code>.</p>

    <div class="callout tip">

L("ci", "Advanced", "Continuous Integration: tests on every push", "7 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p><strong>Continuous Integration</strong> (CI) is the most common use of Actions: automatically run the project's tests on every commit, so you catch broken code before it ships.</p>

    <h2>The shape of a CI workflow</h2>
    <p>For a typical Node.js project, the workflow looks like this:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">.github/workflows/ci.yml</div>
      </div>
      <div class="terminal-body">
<span class="term-out hunk">name:</span><span class="term-out"> CI</span>

<span class="term-out hunk">on:</span>
<span class="term-out">  push:</span>
<span class="term-out">    branches: [main]</span>
<span class="term-out">  pull_request:</span>
<span class="term-out">    branches: [main]</span>

<span class="term-out hunk">jobs:</span>
<span class="term-out">  test:</span>
<span class="term-out">    runs-on: ubuntu-latest</span>
<span class="term-out">    steps:</span>
<span class="term-out">      - uses: actions/checkout@v4</span>
<span class="term-out muted">        # ↑ pull down the repo's code onto the runner</span>

<span class="term-out">      - uses: actions/setup-node@v4</span>
<span class="term-out">        with:</span>
<span class="term-out">          node-version: '20'</span>
<span class="term-out muted">        # ↑ install Node.js v20</span>

<span class="term-out">      - run: npm ci</span>
<span class="term-out muted">        # ↑ install all dependencies (faster, stricter version of npm install)</span>

<span class="term-out">      - run: npm test</span>
<span class="term-out muted">        # ↑ actually run the tests</span>
      </div>
    </div>

    <p>Reading top to bottom: every time someone pushes to main or opens a PR targeting main, GitHub spins up a fresh Ubuntu machine, checks out the code, installs Node.js 20, installs dependencies, and runs <code>npm test</code>. If the tests pass, the run is green. If they fail, the run is red.</p>

    <h2>What it looks like on a PR</h2>
    <p>On a Pull Request, you'll see CI status right next to the merge button:</p>

    <div class="gh-mock">
      <div class="gh-mock-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
        #42 Add contact form
      </div>
      <div class="gh-mock-body">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0;">
          <div style="width: 16px; height: 16px; border-radius: 50%; background: var(--green); color: #0a0a0a; display: grid; place-items: center; font-size: 11px; font-weight: 700;">✓</div>
          <div><strong>All checks have passed</strong> <span style="color: var(--text-3); font-size: 12px;">— 1 successful check</span></div>
        </div>
        <div style="margin-left: 26px; font-size: 12.5px; color: var(--text-2);">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span style="color: var(--green);">✓</span> CI / test — Successful in 1m 34s
          </div>
        </div>
        <div style="margin-top: 14px; padding: 10px 14px; background: var(--green-soft); border: 1px solid rgba(74,222,128,0.30); border-radius: 6px; color: var(--green); font-size: 13px;">
          This branch has no conflicts with the base branch — Merging can be performed automatically.
        </div>
      </div>
    </div>

    <p>When tests fail, the PR shows red and (if the team configured it) the <strong>Merge</strong> button is disabled. The branch can't ship until it's green again. This is the rule that prevents the website from breaking.</p>

    <h2>Branch protection rules</h2>
    <p>To make CI actually mandatory, go to <strong>Settings → Branches → Add branch protection rule</strong> for <code>main</code>:</p>
    <ul>
      <li>☑ Require status checks to pass before merging</li>
      <li>☑ Require pull request reviews before merging (1+ approvers)</li>
      <li>☑ Require branches to be up to date before merging</li>
    </ul>

    <p>Now nobody (not even an admin, if you check that box) can push or merge into main without passing CI and getting an approval. This single setting protects you from 90% of "the website broke and we don't know why" situations.</p>

    <h2>What "tests" actually means</h2>
    <p>Even without writing code, you can ask your developer:</p>
    <ul>
      <li>"What does <code>npm test</code> actually run?"</li>
      <li>"Do we have tests for the contact form?"</li>
      <li>"What's our test coverage?" (a percentage — what fraction of the code is exercised by tests)</li>
    </ul>

    <p>Good developers welcome these questions. They're signs you care about quality.</p>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li>CI = automatic tests on every push and PR.</li>
        <li>A typical CI workflow: check out code → install dependencies → run tests.</li>
        <li>Branch protection rules force PRs to pass CI before they can merge.</li>
        <li>Red runs = broken. Green runs = safe to merge.</li>
      </ul>
    </div>
  `);
});

L("undo", "Advanced", "Undoing mistakes: reset, revert, reflog", "7 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Git almost never actually loses your work. Once something has been committed, there's nearly always a way to get it back. The trick is knowing which "undo" command fits the situation.</p>

    <h2>Three different "undos"</h2>
    <table style="width:100%; border-collapse: collapse; margin: 14px 0; font-size: 13px;">
      <thead>
        <tr style="border-bottom: 1px solid var(--border);">
          <th style="text-align:left; padding: 8px 4px; color: var(--text-3); font-weight: 600;">Command</th>
          <th style="text-align:left; padding: 8px 4px; color: var(--text-3); font-weight: 600;">When to use</th>
          <th style="text-align:left; padding: 8px 4px; color: var(--text-3); font-weight: 600;">Safe to share?</th>
        </tr>
      </thead>
      <tbody style="color: var(--text);">
        <tr style="border-bottom: 1px solid var(--border);"><td style="padding: 8px 4px;"><code>git restore</code></td><td style="padding: 8px 4px;">Throw away uncommitted changes to a file.</td><td style="padding: 8px 4px;">Yes (only affects your machine)</td></tr>
        <tr style="border-bottom: 1px solid var(--border);"><td style="padding: 8px 4px;"><code>git revert</code></td><td style="padding: 8px 4px;">Undo a commit by adding a new commit that reverses it.</td><td style="padding: 8px 4px;"><strong style="color: var(--green);">Yes</strong></td></tr>
        <tr><td style="padding: 8px 4px;"><code>git reset</code></td><td style="padding: 8px 4px;">Move the branch back as if a commit never happened. Rewrites history.</td><td style="padding: 8px 4px;"><strong style="color: var(--red);">Only if not pushed</strong></td></tr>
      </tbody>
    </table>

    <h2>Throwing away uncommitted changes</h2>
    <p>You started editing a file, decided you don't want the changes. Easy:</p>

    ${term("undo-restore")}

    <h2>Reverting a commit that's already pushed</h2>
    <p>A PR was merged, and it turns out it broke something. The clean fix is <code>git revert</code> — it creates a new commit that undoes the bad one:</p>

    ${term("undo-revert")}

    <p>The old commit still exists in history; you've added a new commit that cancels it out. This is the right move for shared branches.</p>

    <h2>Resetting (the nuclear option)</h2>
    <p><code>git reset</code> rewinds your branch pointer to an earlier commit, pretending later commits never happened. Powerful, but dangerous on shared branches.</p>

    ${term("undo-reset")}

    <p>If you've already pushed, you'd need <code>git push --force</code> after this — which rewrites GitHub's history and breaks things for anyone who already pulled. <strong>Reset is for unshared work only.</strong></p>

    <h2>The reflog: your safety net</h2>
    <p>This is the most reassuring command in Git. The <strong>reflog</strong> remembers every move HEAD has made — every commit, every branch switch, every reset — for the last 90 days. If you screwed something up, the reflog can almost always rescue you.</p>

    ${term("undo-reflog")}

    <p>Find the commit you want to recover, then check it out (or reset to it). Your "lost" work is back.</p>

    <div class="callout info">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        When you think work is gone
      </div>
      <div class="callout-body">
        <p>99% of the time, "I lost my work" really means "Git is showing me a different state and I don't know how to navigate back." Run <code>git reflog</code> first. Almost always the rescue is one line away.</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li><code>git restore &lt;file&gt;</code> throws away uncommitted edits to that file.</li>
        <li><code>git revert &lt;commit&gt;</code> safely undoes a commit on a shared branch.</li>
        <li><code>git reset</code> rewinds history — only use on branches nobody else has pulled.</li>
        <li><code>git reflog</code> is the time machine: it logs every move HEAD has made and lets you go back.</li>
      </ul>
    </div>
  `);
});

L("stash-cherry", "Advanced", "Stash and cherry-pick", "5 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Two power-user commands you'll reach for occasionally: <code>stash</code> and <code>cherry-pick</code>. Both solve specific, common annoyances.</p>

    <h2>git stash — pause your work</h2>
    <p>You're in the middle of editing a feature when someone says "urgent: the live site is broken, please fix." You can't commit your half-finished work, and you can't switch branches with uncommitted changes (Git will refuse or carry them with you). <strong>Stash</strong> temporarily sets the changes aside so you can switch contexts cleanly.</p>

    ${term("stash-demo")}

    <p>Stashes are stored in a stack — you can stash multiple times and pop them back in order, or list and pick specifically.</p>

    <h2>git cherry-pick — grab a single commit</h2>
    <p>Someone made a commit on another branch that you also want on your branch, but you don't want the rest of that branch. <strong>Cherry-pick</strong> copies the commit over by itself:</p>

    ${term("cherry-demo")}

    <p>Useful when a hotfix lands on main and you want it on a release branch too — or when a colleague's branch has one commit that solves a problem you're hitting.</p>

    <div class="callout tip">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8V18h6v-1.5c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2z"/></svg>
        Both can conflict
      </div>
      <div class="callout-body">
        <p>Popping a stash or cherry-picking can hit the same merge conflicts as a regular merge. The resolution process is identical: edit the conflicted file, remove the markers, <code>git add</code>, and then either <code>git stash drop</code> (if pop conflicted) or <code>git cherry-pick --continue</code> (if cherry-pick conflicted).</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li><code>git stash</code> tucks uncommitted changes away so you can switch contexts; <code>git stash pop</code> brings them back.</li>
        <li><code>git cherry-pick &lt;commit&gt;</code> copies a single commit from another branch onto your current branch.</li>
        <li>Both are situational — most days you won't need either, but when you do, nothing else does the job.</li>
      </ul>
    </div>
  `);
});

L("releases", "Advanced", "Tags and releases", "5 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>Once a project is being used by anyone — customers, teammates, the public — you'll want a way to say "this exact commit is version 1.0." That's what <strong>tags</strong> and <strong>releases</strong> are for.</p>

    <h2>Tags: a name attached to a commit</h2>
    <p>A tag is a permanent label pointing at a specific commit. Unlike branches, tags don't move — they're frozen.</p>

    ${term("tag-create")}

    <p>The <code>v1.0.0</code> follows <strong>semantic versioning</strong> (semver): <code>MAJOR.MINOR.PATCH</code>.</p>
    <ul>
      <li><strong>MAJOR</strong> (1.x.x) — incompatible changes that break existing usage.</li>
      <li><strong>MINOR</strong> (x.1.x) — new features, backwards compatible.</li>
      <li><strong>PATCH</strong> (x.x.1) — bug fixes only.</li>
    </ul>

    <p>So <code>v1.4.2</code> is the project's 1st major version, with 4 minor releases on it, and 2 patches on top of the most recent minor.</p>

    <h2>Releases: tags with notes</h2>
    <p>A <strong>release</strong> on GitHub is a tag plus a written description plus (optionally) downloadable files. Releases live under the <strong>Releases</strong> link on the right side of a repo's main page.</p>

    <div class="gh-mock">
      <div class="gh-mock-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
        Releases — my-landing-site
      </div>
      <div class="gh-mock-body" style="padding: 14px 16px;">
        <div style="padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 12px;">
          <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px;">
            <span class="badge feat">Latest</span>
            <strong style="color: var(--text);">v1.4.0 — Contact form &amp; dark mode</strong>
          </div>
          <div style="color: var(--text-3); font-size: 12px;">released 2 days ago by USERNAME</div>
          <div style="margin-top: 10px; color: #c8c8d2;">
            <strong style="color: var(--text);">What's new</strong>
            <ul style="margin: 6px 0 0; padding-left: 18px;">
              <li>Added contact form to the homepage (#42)</li>
              <li>Added dark mode toggle (#36)</li>
              <li>Fixed pricing page mobile layout (#39)</li>
            </ul>
          </div>
        </div>
        <div>
          <strong style="color: var(--text);">v1.3.2</strong>
          <span style="color: var(--text-3); font-size: 12px; margin-left: 10px;">released 3 weeks ago</span>
        </div>
      </div>
    </div>

    <h2>Creating a release</h2>
    <p>From the repo, click <strong>Releases → Draft a new release</strong>. Pick the tag (or create a new one inline), write the notes (GitHub has a <em>Generate release notes</em> button that summarizes PRs since the last tag), and publish.</p>

    <p>You can attach files to releases too — useful for distributing installable artifacts, packaged downloads, or anything someone might want to grab directly.</p>

    <div class="callout tip">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8V18h6v-1.5c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2z"/></svg>
        Tags + Actions = automatic deploys
      </div>
      <div class="callout-body">
        <p>A common pattern: configure a GitHub Action to trigger on <code>on: push: tags: ['v*']</code>. Now pushing a tag like <code>v1.4.1</code> automatically kicks off a build, deploys to production, and publishes a release. One command, full release cycle.</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li>A <strong>tag</strong> is a permanent name pointing at a specific commit. Don't move.</li>
        <li><strong>Semver</strong> (MAJOR.MINOR.PATCH) is the universal convention for version numbers.</li>
        <li>A <strong>release</strong> on GitHub is a tag plus written notes plus optional downloadable files.</li>
        <li>Tagging is often automated with a GitHub Action — push a tag, get a full deploy + release.</li>
      </ul>
    </div>
  `);
});

L("pages-basics", "Advanced", "GitHub Pages: free hosting for static sites", "5 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p><strong>GitHub Pages</strong> turns any repo into a public website. Drop in some HTML, flip a switch in Settings, and you have a live URL within a minute. No server, no hosting bill, no FTP. It's built right into the platform you're already using.</p>

    <div class="callout info">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        Meta moment
      </div>
      <div class="callout-body">
        <p>The walkthrough you're reading right now is hosted on GitHub Pages. The exact same Git workflow you've just learned — commit, push, done — is how this page got published.</p>
      </div>
    </div>

    <h2>The three flavours</h2>
    <p>Pages comes in three shapes. They behave identically, only the URL pattern changes:</p>
    <ul>
      <li><strong>User site</strong> — a repo named <code>&lt;your-github-username&gt;.github.io</code> serves at <code>https://&lt;username&gt;.github.io</code>. One per account. Use this for your personal/company homepage.</li>
      <li><strong>Project site</strong> — any other repo, with Pages turned on, serves at <code>https://&lt;username&gt;.github.io/&lt;repo-name&gt;</code>. Use this for docs, demos, or per-project sites.</li>
      <li><strong>Organisation site</strong> — same as User site but owned by a GitHub org. Repo name is <code>&lt;org-name&gt;.github.io</code>.</li>
    </ul>

    <h2>Turning it on</h2>
    <p>Pages is configured per-repo. From any repo:</p>
    <ol>
      <li>Go to <strong>Settings</strong> (the gear-icon tab at the top of the repo).</li>
      <li>In the left sidebar, click <strong>Pages</strong>.</li>
      <li>Under <em>Source</em>, choose <strong>Deploy from a branch</strong>.</li>
      <li>Pick the branch (usually <code>main</code>) and the folder (<code>/ (root)</code> for most cases, <code>/docs</code> if you keep site files in a subfolder).</li>
      <li>Click <strong>Save</strong>.</li>
    </ol>

    <p>GitHub then builds and publishes the site. Refresh the Pages settings page after 30 seconds or so and you'll see a green banner with the live URL.</p>

    <h2>The mental model</h2>
    <div class="gh-mock">
      <div class="gh-mock-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
        Settings → Pages — my-landing-site
      </div>
      <div class="gh-mock-body">
        <p style="margin:0 0 8px;"><strong>Your site is live at</strong></p>
        <p style="margin:0 0 14px;"><code>https://my-landing-site.com/</code></p>
        <p style="margin:0 0 6px; color: var(--text-2); font-size: 12px;">Source: Deploy from a branch — <code>main</code> / <code>/ (root)</code></p>
        <p style="margin:0; color: var(--text-2); font-size: 12px;">Last deployed: 2 minutes ago</p>
      </div>
    </div>

    <h2>What it actually serves</h2>
    <p>Pages is a <strong>static</strong> host — it serves whatever HTML, CSS, JS, images and assets are in your repo, exactly as-is. There's no database, no backend code, no PHP or Python running on the server. Anything that can be done with files (a landing page, a portfolio, a tutorial, a single-page app, even something interactive like a calculator) works.</p>

    <p>The file at the root, named <code>index.html</code>, is what's served when someone visits <code>/</code>. After that, paths map straight to files — visiting <code>/tutorials/github-zero-to-hero.html</code> serves the file at that path in the repo. Folders containing an <code>index.html</code> get served when you hit the folder URL with a trailing slash.</p>

    <h2>Jekyll, or not</h2>
    <p>By default Pages runs your files through <strong>Jekyll</strong>, a static-site generator that supports Markdown, layouts, and templating. If you only have plain HTML, Jekyll just passes the files through untouched — you can ignore it entirely. If you want Jekyll's features (writing posts in Markdown, sharing a header/footer across pages), drop a <code>_config.yml</code> at the root and start using its conventions.</p>

    <p>To opt out of Jekyll entirely (sometimes useful if filenames starting with <code>_</code> are being skipped), add an empty file called <code>.nojekyll</code> at the repo root. Done.</p>

    <div class="callout tip">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8V18h6v-1.5c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2z"/></svg>
        It's just files
      </div>
      <div class="callout-body">
        <p>The fastest way to understand Pages is to remember: it's a folder of files on the internet. Every push updates the folder. Every URL maps to a file. That's the whole thing.</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li>Pages = free static hosting tied to a GitHub repo.</li>
        <li>Three flavours: User site (one per account), Project site (per-repo), Org site (one per org).</li>
        <li>Turn it on under Settings → Pages, pick a branch, save.</li>
        <li>It serves files exactly as they are — plain HTML works, Jekyll is optional.</li>
        <li><code>index.html</code> is the home page; URL paths map to file paths.</li>
      </ul>
    </div>
  `);
});

L("custom-domain", "Advanced", "Custom domains and HTTPS", "7 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>By default a Pages site lives at <code>&lt;username&gt;.github.io/&lt;repo&gt;</code>. That works, but for anything you'll share publicly — a company site, a portfolio, a tutorial you send to clients — you want a real domain. Pages supports <strong>custom domains</strong> with free HTTPS, and the setup takes about 10 minutes the first time.</p>

    <h2>The two flavours: apex and subdomain</h2>
    <p>There are two kinds of domain you might point at Pages:</p>
    <ul>
      <li><strong>Apex domain</strong> — the bare domain itself, like <code>my-landing-site.com</code>. Sometimes called the "root" or "naked" domain.</li>
      <li><strong>Subdomain</strong> — anything in front of the apex, like <code>www.my-landing-site.com</code>, <code>learn.my-landing-site.com</code>, or <code>docs.my-landing-site.com</code>.</li>
    </ul>
    <p>Both work. Subdomains are slightly simpler to set up (a single CNAME record), apex domains need a different DNS record type (A records). The end-user experience is identical.</p>

    <h2>Step 1 — Tell GitHub the domain</h2>
    <p>In your repo: <strong>Settings → Pages → Custom domain</strong>. Type the domain you want (e.g. <code>my-landing-site.com</code> or <code>learn.my-landing-site.com</code>) and save. GitHub automatically creates a file called <code>CNAME</code> at the root of your repo containing that domain name. That file is how Pages knows which domain to serve when a request arrives.</p>

    <div class="callout info">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
        The CNAME file is just text
      </div>
      <div class="callout-body">
        <p>If you ever need to change it, edit the file directly in the repo. One line, the domain name, no quotes, no protocol. It's just a marker telling Pages "this repo answers to this domain."</p>
      </div>
    </div>

    <h2>Step 2 — Configure DNS at your registrar</h2>
    <p>Your registrar (GoDaddy, Cloudflare, Namecheap, etc.) is where you bought the domain. That's where you control the DNS records that tell the internet which server to go to when someone types your domain in the browser.</p>

    <p>Open your registrar's DNS panel. The exact UI varies, but every registrar lets you add records of various types. You need different records depending on whether you're pointing an apex or a subdomain:</p>

    <h3>For a subdomain (<code>learn.my-landing-site.com</code>)</h3>
    <p>Add one <strong>CNAME record</strong>:</p>
    <ul>
      <li><strong>Type:</strong> CNAME</li>
      <li><strong>Name / Host:</strong> <code>learn</code> (just the subdomain part, not the whole thing)</li>
      <li><strong>Value / Target:</strong> <code>&lt;your-github-username&gt;.github.io</code> (no <code>https://</code>, no trailing slash)</li>
      <li><strong>TTL:</strong> leave at default (1 hour is fine)</li>
    </ul>

    <h3>For an apex domain (<code>my-landing-site.com</code>)</h3>
    <p>You can't use a CNAME for the apex (DNS standards disallow it). Instead, add four <strong>A records</strong>, all with the same name (the apex itself, often shown as <code>@</code> or blank), pointing at GitHub's four Pages IP addresses:</p>
    <ul>
      <li><code>185.199.108.153</code></li>
      <li><code>185.199.109.153</code></li>
      <li><code>185.199.110.153</code></li>
      <li><code>185.199.111.153</code></li>
    </ul>
    <p>These are GitHub's published IPs for Pages. They've been stable for years; they're documented in the official Pages docs.</p>

    <h2>Step 3 — Wait for DNS to propagate</h2>
    <p>DNS changes are not instant. After saving the records, the internet takes anywhere from a couple of minutes to (rarely) a few hours to start using them. You can check whether your changes are live with the <code>dig</code> command:</p>

    ${term("dns-check")}

    <p>If <code>dig</code> still shows old values, wait and try again. Don't keep changing records — that just resets the clock.</p>

    <h2>Step 4 — Turn on HTTPS</h2>
    <p>Once DNS resolves correctly, go back to <strong>Settings → Pages</strong>. After a minute or two, the <strong>Enforce HTTPS</strong> checkbox becomes clickable. Tick it. GitHub provisions a free TLS certificate via Let's Encrypt and renews it automatically forever. Your site is now served at <code>https://</code> with the green padlock.</p>

    <div class="callout warn">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Common gotchas
      </div>
      <div class="callout-body">
        <p><strong>Mixing apex and www:</strong> you'll want both <code>my-landing-site.com</code> and <code>www.my-landing-site.com</code> to work. Set the apex as your Pages custom domain (A records), and add a CNAME record for <code>www</code> pointing at <code>&lt;username&gt;.github.io</code>. GitHub will redirect <code>www</code> to the apex automatically.</p>
        <p><strong>Leftover GoDaddy parking page:</strong> when you first buy a domain, GoDaddy sometimes pre-fills DNS records that point at their own parking server. Delete those before adding GitHub's records, otherwise you'll get redirected to a "Your domain is parked" page.</p>
        <p><strong>HTTPS checkbox greyed out:</strong> it stays disabled until DNS fully resolves to GitHub. Wait an hour, refresh, try again. If it's still greyed out after 24 hours, run <code>dig</code> — DNS isn't right yet.</p>
      </div>
    </div>

    <h2>Picking a domain pattern</h2>
    <p>For most cases, the cleanest setup is:</p>
    <ul>
      <li><strong>Apex</strong> (<code>my-landing-site.com</code>) for the main marketing site.</li>
      <li><strong>Subdomain</strong> for everything else: <code>docs.</code>, <code>app.</code>, <code>learn.</code>, <code>blog.</code>. Each can point at a different repo on GitHub Pages — or to entirely different hosts.</li>
    </ul>
    <p>This makes each project independently deployable. Updating <code>docs.</code> never touches the marketing site, and vice versa.</p>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li>Pages supports custom domains with free auto-renewing HTTPS.</li>
        <li>Apex domains need four A records pointing at GitHub's IPs. Subdomains use a single CNAME record.</li>
        <li>The repo's <code>CNAME</code> file tells Pages which domain to answer to.</li>
        <li>DNS changes take minutes to hours. Use <code>dig</code> to verify.</li>
        <li>Tick "Enforce HTTPS" once DNS resolves — it's free and automatic.</li>
      </ul>
    </div>
  `);
});

L("pages-actions", "Advanced", "Deploy automatically with Actions", "5 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>The basic Pages flow ("Deploy from a branch") works perfectly when your repo already contains the files you want served — plain HTML, an exported static site, a folder of Markdown. But sometimes the files you commit aren't the files you want to serve: maybe you write in Astro, Hugo, Next.js, or any framework that needs a <em>build</em> step to turn source code into static HTML. That's where <strong>GitHub Actions</strong> takes over the deploy.</p>

    <h2>The two modes of Pages</h2>
    <p>In Settings → Pages → Source there are two options:</p>
    <ul>
      <li><strong>Deploy from a branch</strong> — the simple mode. GitHub copies whatever's in the chosen branch and folder, no transformation. Best when your repo already contains the final HTML.</li>
      <li><strong>GitHub Actions</strong> — the flexible mode. You write a workflow that builds the site (running <code>npm run build</code>, <code>hugo</code>, whatever your tool needs) and uploads the result. Pages serves whatever the workflow uploads.</li>
    </ul>

    <h2>A minimal deploy workflow</h2>
    <p>This is what a static-site deploy workflow looks like. Drop it at <code>.github/workflows/deploy.yml</code>:</p>

    <div class="terminal" style="margin-bottom:18px;">
      <div class="terminal-head">
        <div class="terminal-dots"><span></span><span></span><span></span></div>
        <div class="terminal-title">.github/workflows/deploy.yml</div>
      </div>
      <div class="terminal-body">
<span class="term-out hunk">name:</span><span class="term-out"> Deploy to Pages</span>
<span class="term-out hunk">on:</span>
<span class="term-out">  push:</span>
<span class="term-out">    branches: [main]</span>
<span class="term-out">  workflow_dispatch:</span>

<span class="term-out hunk">permissions:</span>
<span class="term-out">  contents: read</span>
<span class="term-out">  pages: write</span>
<span class="term-out">  id-token: write</span>

<span class="term-out hunk">jobs:</span>
<span class="term-out">  build:</span>
<span class="term-out">    runs-on: ubuntu-latest</span>
<span class="term-out">    steps:</span>
<span class="term-out">      - uses: actions/checkout@v4</span>
<span class="term-out">      - uses: actions/setup-node@v4</span>
<span class="term-out">        with: { node-version: 20 }</span>
<span class="term-out">      - run: npm ci</span>
<span class="term-out">      - run: npm run build</span>
<span class="term-out">      - uses: actions/upload-pages-artifact@v3</span>
<span class="term-out">        with: { path: ./dist }</span>

<span class="term-out">  deploy:</span>
<span class="term-out">    needs: build</span>
<span class="term-out">    runs-on: ubuntu-latest</span>
<span class="term-out">    environment:</span>
<span class="term-out">      name: github-pages</span>
<span class="term-out">      url: \${{ steps.deployment.outputs.page_url }}</span>
<span class="term-out">    steps:</span>
<span class="term-out">      - id: deployment</span>
<span class="term-out">        uses: actions/deploy-pages@v4</span>
      </div>
    </div>

    <p>Reading that:</p>
    <ul>
      <li><strong>The build job</strong> checks out the code, installs Node, runs <code>npm run build</code>, and uploads the output folder (<code>./dist</code> — change to wherever your build tool writes its output) as a Pages artifact.</li>
      <li><strong>The deploy job</strong> waits for the build to finish, then uses GitHub's official <code>deploy-pages</code> action to publish the artifact to Pages.</li>
      <li><strong>Permissions</strong> let the workflow write to Pages and get a signing token — these are required.</li>
    </ul>

    <p>Switch Settings → Pages → Source to <strong>GitHub Actions</strong>, commit the workflow, push. From now on every push to <code>main</code> rebuilds and republishes the site. The Actions tab shows each run.</p>

    <h2>When to bother with this</h2>
    <p>Stay on the simple "Deploy from a branch" mode unless one of these applies:</p>
    <ul>
      <li>You use a framework that needs to compile (React, Vue, Astro, Next.js static export, Hugo, Eleventy, Jekyll with custom plugins).</li>
      <li>You want pre-deploy steps: linting, minification, image optimisation, fetching external data.</li>
      <li>You want to deploy from a branch other than <code>main</code> (e.g. only on tagged releases).</li>
    </ul>

    <p>For plain HTML — like this tutorial — the basic branch deploy is more than enough. No workflow needed.</p>

    <div class="callout tip">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.1 1 1.8V18h6v-1.5c0-.7.4-1.4 1-1.8A7 7 0 0 0 12 2z"/></svg>
        Don't reinvent the wheel
      </div>
      <div class="callout-body">
        <p>Most frameworks (Astro, Next.js, SvelteKit, Hugo) publish an official "deploy to GitHub Pages" template you can copy verbatim. Check the framework's docs before hand-rolling a workflow — you'll save an hour of trial and error.</p>
      </div>
    </div>

    <div class="takeaways">
      <h3>Key takeaways</h3>
      <ul>
        <li>Pages has two modes: deploy-from-branch (simple, file-as-is) and GitHub Actions (flexible, runs a build).</li>
        <li>Use the Actions mode when you need a build step — frameworks, transpilation, asset processing.</li>
        <li>The official <code>actions/upload-pages-artifact</code> + <code>actions/deploy-pages</code> pair handles the heavy lifting.</li>
        <li>Switch the Source dropdown to "GitHub Actions" or the workflow won't be allowed to publish.</li>
        <li>Frameworks usually publish a ready-made deploy workflow — copy theirs.</li>
      </ul>
    </div>
  `);
});


L("wrap-up", "Advanced", "Where to go from here", "3 min", (host) => {
  host.insertAdjacentHTML("beforeend", `
    <p>That's the tour. You now have a working mental model of Git and a complete picture of how GitHub fits around it. The commands and concepts in this walkthrough cover what you'll see day-to-day on any modern software team.</p>

    <h2>The minimum you'll use</h2>
    <p>If you only ever remember six commands, these are the six:</p>
    <ul>
      <li><code>git clone &lt;url&gt;</code> — get a copy of a repo</li>
      <li><code>git status</code> — what's changed?</li>
      <li><code>git add &lt;file&gt;</code> + <code>git commit -m "msg"</code> — save a checkpoint</li>
      <li><code>git push</code> — upload to GitHub</li>
      <li><code>git pull</code> — get the latest from GitHub</li>
      <li><code>git switch &lt;branch&gt;</code> — change which branch you're on</li>
    </ul>

    <h2>The GitHub Habits</h2>
    <ul>
      <li><strong>Pull before you start.</strong> Push before you stop.</li>
      <li><strong>One branch per task.</strong> Merge through a Pull Request.</li>
      <li><strong>Small commits, clear messages.</strong> Your future self will thank you.</li>
      <li><strong>Read PRs.</strong> Even when you're not the developer, the Files changed tab tells you what's about to ship.</li>
      <li><strong>Protect main.</strong> Branch protection rules are five minutes of setup that prevent days of mess.</li>
    </ul>

    <h2>If you get stuck</h2>
    <p>Three places to look, in order:</p>
    <ol>
      <li><code>git status</code> — Git is unusually good at telling you what state you're in and what to do next.</li>
      <li><a href="https://docs.github.com">docs.github.com</a> — official docs, well-organized, searchable.</li>
      <li><a href="https://ohshitgit.com">ohshitgit.com</a> — a wonderful page of "I messed up, how do I fix it?" recipes.</li>
    </ol>

    <div class="callout tip">
      <div class="callout-head">
        <svg class="ico" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        You've finished
      </div>
      <div class="callout-body">
        <p>That's the whole course. Mark this lesson complete and the bar will hit 100%. Go open a repo — there's no substitute for actually doing it. Make a commit. Push it. Open a PR. You know enough to begin.</p>
      </div>
    </div>
  `);
});

<script>
function renderSidebar() {
  const nav = $("#nav");
  nav.innerHTML = "";
  const groupMap = {};
  const order = [];
  for (const l of LESSONS) {
    if (!groupMap[l.group]) { groupMap[l.group] = []; order.push(l.group); }
    groupMap[l.group].push(l);
  }
  for (const groupName of order) {
    const items = groupMap[groupName];
    const collapsed = state.collapsed.has(groupName);
    const section = el("div", { class: "section" + (collapsed ? " collapsed" : "") });
    const doneCount = items.filter(i => state.done.has(i.id)).length;
    const head = el("div", { class: "section-head", onclick: () => {
      if (state.collapsed.has(groupName)) state.collapsed.delete(groupName);
      else state.collapsed.add(groupName);
      localStorage.setItem("ght.collapsed", JSON.stringify(Array.from(state.collapsed)));
      renderSidebar();
    }});
    head.appendChild(el("span", {}, groupName));
    head.appendChild(el("span", { class: "section-count" }, `${doneCount}/${items.length}`));
    section.appendChild(head);
    const list = el("div", { class: "section-list" });
    for (const item of items) {
      const active = state.current === item.id;
      const done = state.done.has(item.id);
      const navItem = el("div", { class: "nav-item" + (active ? " active" : "") + (done ? " done" : ""),
        onclick: () => goTo(item.id) });
      navItem.appendChild(el("div", { class: "nav-check" }));
      navItem.appendChild(el("div", { class: "nav-title" }, item.title));
      list.appendChild(navItem);
    }
    section.appendChild(list);
    nav.appendChild(section);
  }
  const pct = LESSONS.length ? Math.round((state.done.size / LESSONS.length) * 100) : 0;
  $("#progress-pct").textContent = `${pct}%`;
  $("#progress-fill").style.width = `${pct}%`;
  const resetBtn = $("#reset-btn");
  if (resetBtn) resetBtn.disabled = state.done.size === 0;
}

function renderCrumbs(lesson) {
  const c = $("#crumbs");
  c.innerHTML = "";
  c.appendChild(el("span", {}, "GitHub Zero to Hero"));
  c.appendChild(el("span", { class: "crumb-sep" }, "/"));
  c.appendChild(el("span", {}, lesson.group));
  c.appendChild(el("span", { class: "crumb-sep" }, "/"));
  c.appendChild(el("span", { class: "crumb-current" }, lesson.title));
}

function renderLesson(id) {
  const lesson = LESSONS.find(l => l.id === id);
  if (!lesson) return;
  state.current = id;
  state.activeTerminal = null;
  const host = $("#lesson");
  host.innerHTML = "";
  renderCrumbs(lesson);

  host.appendChild(el("div", { class: "lesson-tag" }, lesson.group));
  host.appendChild(el("h1", {}, lesson.title));
  host.appendChild(el("div", { class: "lesson-meta" },
    el("span", { class: "lesson-meta-item", html: '<svg class="ico ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> ' + lesson.time }),
    el("span", { class: "lesson-meta-item", html: '<svg class="ico ico-sm" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> Lesson ' + (LESSONS.findIndex(l => l.id === id) + 1) + ' of ' + LESSONS.length })
  ));

  lesson.render(host);

  const done = state.done.has(id);
  const idx = LESSONS.findIndex(l => l.id === id);
  const prev = idx > 0 ? LESSONS[idx - 1] : null;
  const next = idx < LESSONS.length - 1 ? LESSONS[idx + 1] : null;
  const completeBtn = el("button", { class: "complete-btn" + (done ? " done" : ""), onclick: () => {
    const wasDone = state.done.has(id);
    if (wasDone) state.done.delete(id);
    else state.done.add(id);
    localStorage.setItem("ght.done", JSON.stringify(Array.from(state.done)));
    renderSidebar();
    // Auto-advance to next lesson when marking complete (but stay put when un-marking or on last lesson)
    if (!wasDone && next) { goTo(next.id); return; }
    renderLesson(id);
  }});
  completeBtn.innerHTML = '<svg class="ico" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>' + (done ? "Completed" : (next ? "Mark complete & continue →" : "Mark as complete"));
  host.appendChild(completeBtn);
  const foot = el("div", { class: "lesson-foot" });
  const prevBtn = el("button", { class: "foot-btn", onclick: () => prev && goTo(prev.id) });
  if (!prev) prevBtn.disabled = true;
  prevBtn.innerHTML = '<div class="foot-dir">← Previous</div><div class="foot-title">' + (prev ? prev.title : "Start of course") + '</div>';
  const nextBtn = el("button", { class: "foot-btn next", onclick: () => next && goTo(next.id) });
  if (!next) nextBtn.disabled = true;
  nextBtn.innerHTML = '<div class="foot-dir">Next →</div><div class="foot-title">' + (next ? next.title : "Course complete") + '</div>';
  foot.appendChild(prevBtn);
  foot.appendChild(nextBtn);
  host.appendChild(foot);

  $$(".term-host-mount", host).forEach(mount => {
    const scriptName = mount.dataset.script;
    const optsRaw = (mount.dataset.opts || "{}").replace(/&apos;/g, "'");
    let opts = {};
    try { opts = JSON.parse(optsRaw); } catch (e) { opts = {}; }
    const script = TERMINAL_SCRIPTS[scriptName];
    if (script) new Terminal(mount, script, opts);
  });

  renderSidebar();
  try { $(".main").scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { $(".main").scrollTop = 0; }
  window.history.replaceState(null, "", "#" + id);
}

function goTo(id) {
  renderLesson(id);
  // Auto-close the mobile drawer after navigating
  if (window.innerWidth <= 880) closeDrawer();
}

// ---- Mobile drawer ----
function openDrawer() {
  $(".sidebar").classList.add("open");
  $("#scrim").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeDrawer() {
  $(".sidebar").classList.remove("open");
  $("#scrim").classList.remove("show");
  document.body.style.overflow = "";
}
$("#sidebar-toggle").addEventListener("click", openDrawer);
$("#scrim").addEventListener("click", closeDrawer);

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable) return;
  if (e.key === "Escape") { closeDrawer(); return; }
  if (e.key === " ") {
    if (state.activeTerminal) { e.preventDefault(); state.activeTerminal.toggle(); }
    return;
  }
  const k = e.key.toLowerCase();
  const idx = LESSONS.findIndex(l => l.id === state.current);
  if (k === "j") {
    if (idx >= 0 && idx < LESSONS.length - 1) goTo(LESSONS[idx + 1].id);
  } else if (k === "k") {
    if (idx > 0) goTo(LESSONS[idx - 1].id);
  }
});

// ---- OS picker ----
function setOS(os) {
  if (!OS_PROFILE[os]) return;
  state.os = os;
  localStorage.setItem("ght.os", os);
  $$(".os-tab").forEach(t => t.classList.toggle("active", t.dataset.os === os));
  if (state.current) renderLesson(state.current);
}
$$(".os-tab").forEach(t => {
  t.addEventListener("click", () => setOS(t.dataset.os));
  t.classList.toggle("active", t.dataset.os === state.os);
});

// ---- Reset progress ----
$("#reset-btn").addEventListener("click", () => {
  if (state.done.size === 0) return;
  if (!confirm("Clear all completed lessons?")) return;
  state.done.clear();
  localStorage.setItem("ght.done", "[]");
  renderSidebar();
  if (state.current) renderLesson(state.current);
});

// ---- Hash routing ----
window.addEventListener("hashchange", () => {
  const id = window.location.hash.slice(1);
  if (id && LESSONS.find(l => l.id === id) && id !== state.current) {
    renderLesson(id);
  }
});

// ---- Boot ----
(function init() {
  const hash = window.location.hash.slice(1);
  const initialId = (hash && LESSONS.find(l => l.id === hash)) ? hash : LESSONS[0].id;
  renderLesson(initialId);
})();
</script>

</body>
</html>
